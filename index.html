<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二模五科 AI｜會考風格 V5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d14;color:#f4f7fb;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
header{padding:18px 22px;border-bottom:1px solid #263142;background:#0d121b;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px}.sub{color:#9aa8bb;font-size:13px;margin-top:5px}
main{max-width:1100px;margin:auto;padding:24px}.panel{background:#111823;border:1px solid #2b3748;border-radius:16px;padding:22px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.card,.opt{background:#151d29;border:1px solid #344255;border-radius:14px;color:white;cursor:pointer;transition:.15s}
.card{padding:20px;text-align:left}.card:hover,.opt:hover{transform:translateY(-2px);border-color:#7ea7ff}
.card b{font-size:20px}.muted{color:#9aa8bb}.hidden{display:none}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.bar{height:8px;background:#202a38;border-radius:99px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:#82aaff;width:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.opt{min-height:120px;padding:18px;display:flex;gap:14px;align-items:flex-start;text-align:left}
.badge{width:46px;height:46px;border-radius:10px;background:#eef3ff;color:#0b1220;display:grid;place-items:center;font-weight:900;font-size:21px;flex:none}
.opt:hover .badge{background:#bcd0ff}.selected{border-color:#9dbdff;box-shadow:0 0 0 2px #506da4 inset}
button{border:1px solid #40506a;background:#e9eef7;color:#0b111a;padding:11px 16px;border-radius:10px;font-weight:700;cursor:pointer}button.dark{background:#151d29;color:#fff}.nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.score{font-size:42px;font-weight:800}.pill{display:inline-block;border:1px solid #344255;border-radius:999px;padding:5px 10px;color:#b7c4d7;font-size:12px}
@media(max-width:700px){.opts{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><h1>二模五科 AI｜會考風格 V5</h1><div class="sub">黑底白字・無時限・選項點擊・題目不重複</div></header>
<main>
<section id="home" class="panel">
<h2>選擇科目</h2>
<p class="muted">題型結構依你提供的 115P 試題本參考；題目為原創練習題。</p>
<div id="subjects" class="grid"></div>
</section>
<section id="exam" class="panel hidden">
<div class="top"><div><span id="subject" class="pill"></span><h2 id="qtitle"></h2></div><div id="counter" class="pill"></div></div>
<div class="bar"><i id="progress"></i></div>
<div id="question"></div>
<div id="opts" class="opts"></div>
<div class="nav"><button class="dark" onclick="prev()">← 上一題</button><button onclick="next()">下一題 →</button></div>
</section>
<section id="result" class="panel hidden">
<h2>作答完成</h2><div class="score" id="score"></div><p id="detail" class="muted"></p>
<button onclick="location.reload()">重新開始</button>
</section>
</main>
<script>
const subjects=["國文","英語","數學","自然","社會"];
let bank, current=[],idx=0,answers=[],subject="";
fetch("questions.json").then(r=>r.json()).then(d=>{bank=d;renderSubjects()});
function renderSubjects(){
 const counts=bank.meta.counts;
 document.querySelector("#subjects").innerHTML=subjects.map(s=>`
 <button class="card" onclick="start('${s}')"><b>${s}</b><br><span class="muted">${typeof counts[s]==="number"?counts[s]+" 題會考式結構":"55 題原創補充"}</span></button>`).join("");
}
function start(s){
 subject=s;
 current=[...bank.questions[s]].sort(()=>Math.random()-.5);
 idx=0;answers=Array(current.length).fill(null);
 document.querySelector("#home").classList.add("hidden");document.querySelector("#result").classList.add("hidden");document.querySelector("#exam").classList.remove("hidden");render();
}
function render(){
 const x=current[idx];document.querySelector("#subject").textContent=subject;
 document.querySelector("#counter").textContent=`${idx+1} / ${current.length}`;
 document.querySelector("#qtitle").textContent=`${subject}｜${x.tag}`;
 document.querySelector("#question").innerHTML=`<div style="font-size:20px;line-height:1.8">${x.q}</div>`;
 document.querySelector("#progress").style.width=((idx+1)/current.length*100)+"%";
 document.querySelector("#opts").innerHTML=x.o.map((o,i)=>`<button class="opt ${answers[idx]===i?"selected":""}" onclick="choose(${i})"><span class="badge">${"ABCD"[i]}</span><span>${o}</span></button>`).join("");
}
function choose(i){answers[idx]=i;render()}
function prev(){if(idx>0){idx--;render()}}
function next(){if(idx<current.length-1){idx++;render()}else finish()}
function finish(){
 let correct=answers.reduce((n,a,i)=>n+(a===current[i].a?1:0),0);
 document.querySelector("#exam").classList.add("hidden");document.querySelector("#result").classList.remove("hidden");
 document.querySelector("#score").textContent=`${correct} / ${current.length}`;
 document.querySelector("#detail").textContent=`${subject}｜本次題目已隨機排序，作答沒有時間限制。`;
}
</script>
</body>
</html>
